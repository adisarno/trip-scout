name: Tests
on:
  push:
    paths-ignore: ['data/**', '*.md']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - run: python run.py --dry-run --fixture tests/fixtures/fares.json --stay-fixture tests/fixtures/stays.json
